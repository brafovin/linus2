<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<title>Skibidi Toilet — Flucht!</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #87ceeb;
    color: #fff;
    font-family: "Comic Sans MS", "Trebuchet MS", sans-serif;
    overflow: hidden;
    height: 100%;
  }
  #game {
    display: block;
    margin: 0 auto;
    background: #6db96d;
    image-rendering: pixelated;
    cursor: none;
  }
  #hud {
    position: fixed;
    top: 12px;
    left: 12px;
    font-size: 18px;
    text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
    pointer-events: none;
    user-select: none;
    line-height: 1.4em;
    font-weight: bold;
  }
  #subtitle {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 24px;
    text-align: center;
    text-shadow: 3px 3px 0 #000;
    pointer-events: none;
    user-select: none;
    max-width: 90%;
    opacity: 0;
    transition: opacity 0.3s;
    color: #ffe14a;
    font-weight: bold;
  }
  #subtitle.show { opacity: 1; }
  #overlay {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle, #5a3a1a 0%, #2a1a0a 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    z-index: 10;
    transition: opacity 0.6s;
    padding: 20px;
    box-sizing: border-box;
  }
  #overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  #overlay.start {
    background: linear-gradient(180deg, #87ceeb 0%, #6db96d 100%);
  }
  #overlay h1 {
    font-size: 64px;
    margin: 0 0 10px 0;
    color: #ffe14a;
    letter-spacing: 4px;
    text-shadow: 4px 4px 0 #000, 8px 8px 0 #8b4513;
  }
  #overlay h2 {
    font-size: 24px;
    margin: 0 0 24px 0;
    color: #fff;
    letter-spacing: 1px;
    text-shadow: 2px 2px 0 #000;
  }
  #overlay p {
    max-width: 560px;
    line-height: 1.6em;
    color: #fff;
    font-size: 16px;
    text-shadow: 2px 2px 0 #000;
  }
  #overlay button {
    margin-top: 22px;
    background: #ffe14a;
    border: 4px solid #000;
    color: #000;
    padding: 14px 36px;
    font-family: inherit;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
    letter-spacing: 2px;
    border-radius: 8px;
    box-shadow: 4px 4px 0 #000;
  }
  #overlay button:hover {
    background: #fff;
    transform: translate(-2px, -2px);
    box-shadow: 6px 6px 0 #000;
  }
  .key {
    color: #ffe14a;
    background: #000;
    padding: 2px 8px;
    border-radius: 4px;
    font-family: monospace;
  }
  #poop-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 8;
    background: radial-gradient(circle at center, rgba(90,55,25,0.0) 0%, rgba(70,40,20,0.0) 100%);
    transition: background 0.4s;
  }
  #poop-overlay.active {
    background: radial-gradient(circle at center, rgba(80,45,20,0.9) 0%, rgba(40,20,10,0.95) 100%);
  }
</style>
</head>
<body>
<canvas id="game" width="960" height="600"></canvas>
<div id="hud"></div>
<div id="subtitle"></div>
<div id="poop-overlay"></div>

<div id="overlay" class="start">
  <h1>SKIBIDI FLUCHT</h1>
  <h2>Renn um dein Leben!</h2>
  <p>
    Ein Skibidi Toilet verfolgt dich.<br>
    Wenn er dich schnappt — wirst du <b>ANGEKACKT</b>. 💩<br><br>
    Sammle <b>Klopapier</b> 🧻 für Punkte und <b>Pömpel</b> für Sprintkraft.<br>
    Überlebe so lange wie möglich!<br><br>
    <span class="key">WASD</span> oder <span class="key">Pfeile</span> &nbsp;bewegen<br>
    <span class="key">SHIFT</span> sprinten<br>
  </p>
  <button id="startBtn">RENNEN!</button>
</div>

<script>
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const hud = document.getElementById("hud");
const subtitleEl = document.getElementById("subtitle");
const overlay = document.getElementById("overlay");
const startBtn = document.getElementById("startBtn");
const poopOverlay = document.getElementById("poop-overlay");

const W = canvas.width;
const H = canvas.height;

const WORLD_W = 2400;
const WORLD_H = 1800;
const TILE = 60;

const keys = {};
addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key === " ") e.preventDefault();
});
addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

// --- Audio ---
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { audioCtx = null; }
  }
}
function tone(freq, dur, type = "square", vol = 0.15) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(audioCtx.destination);
  o.start(t);
  o.stop(t + dur);
}
function skibidiSing() {
  if (!audioCtx) return;
  const t0 = audioCtx.currentTime;
  const notes = [330, 392, 330, 261, 330, 392];
  notes.forEach((f, i) => {
    setTimeout(() => tone(f, 0.12, "square", 0.08), i * 110);
  });
}
function poopSound() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const bufferSize = audioCtx.sampleRate * 0.6;
  const buf = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 1.5) * 0.7;
  }
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.5, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
  const filter = audioCtx.createBiquadFilter();
  filter.type = "lowpass";
  filter.frequency.value = 500;
  src.connect(filter).connect(g).connect(audioCtx.destination);
  src.start(t);
}
function pickupSound() {
  tone(660, 0.08, "triangle", 0.18);
  setTimeout(() => tone(880, 0.1, "triangle", 0.18), 80);
}
function flushSound() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const bufferSize = audioCtx.sampleRate * 0.8;
  const buf = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = (Math.random() * 2 - 1) * 0.5;
  }
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.15, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.8);
  const filter = audioCtx.createBiquadFilter();
  filter.type = "bandpass";
  filter.frequency.value = 1500;
  src.connect(filter).connect(g).connect(audioCtx.destination);
  src.start(t);
}

// --- World ---
let walls = [];
let bushes = [];
let toiletPapers = [];
let plungers = [];
let player, toilet;
let toilets = [];

function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}
function circleRectOverlap(cx, cy, cr, r) {
  const nx = Math.max(r.x, Math.min(cx, r.x + r.w));
  const ny = Math.max(r.y, Math.min(cy, r.y + r.h));
  const dx = cx - nx, dy = cy - ny;
  return dx * dx + dy * dy < cr * cr;
}

function buildWorld() {
  walls = [];
  bushes = [];

  // Border fence
  walls.push({ x: 0, y: 0, w: WORLD_W, h: 30 });
  walls.push({ x: 0, y: WORLD_H - 30, w: WORLD_W, h: 30 });
  walls.push({ x: 0, y: 0, w: 30, h: WORLD_H });
  walls.push({ x: WORLD_W - 30, y: 0, w: 30, h: WORLD_H });

  // Scattered hedges / obstacles to weave through
  const obstacles = [
    { x: 300, y: 250, w: 200, h: 40 },
    { x: 600, y: 400, w: 40, h: 200 },
    { x: 900, y: 200, w: 250, h: 40 },
    { x: 1200, y: 500, w: 40, h: 250 },
    { x: 1500, y: 300, w: 200, h: 40 },
    { x: 1800, y: 600, w: 40, h: 200 },
    { x: 2000, y: 350, w: 200, h: 40 },
    { x: 400, y: 800, w: 250, h: 40 },
    { x: 800, y: 900, w: 40, h: 200 },
    { x: 1100, y: 1100, w: 250, h: 40 },
    { x: 1500, y: 950, w: 40, h: 250 },
    { x: 1900, y: 1050, w: 250, h: 40 },
    { x: 300, y: 1300, w: 40, h: 250 },
    { x: 700, y: 1400, w: 250, h: 40 },
    { x: 1200, y: 1500, w: 40, h: 200 },
    { x: 1700, y: 1400, w: 250, h: 40 },
    { x: 2050, y: 1300, w: 40, h: 200 },
    { x: 500, y: 600, w: 60, h: 60 },
    { x: 1400, y: 700, w: 60, h: 60 },
    { x: 950, y: 1300, w: 60, h: 60 },
    { x: 1900, y: 850, w: 60, h: 60 },
  ];
  for (const o of obstacles) {
    walls.push(o);
    bushes.push(o);
  }

  // Toilet paper pickups
  toiletPapers = [];
  for (let i = 0; i < 15; i++) {
    let x, y, ok = false, tries = 0;
    while (!ok && tries++ < 50) {
      x = 100 + Math.random() * (WORLD_W - 200);
      y = 100 + Math.random() * (WORLD_H - 200);
      ok = true;
      for (const w of walls) {
        if (x > w.x - 30 && x < w.x + w.w + 30 && y > w.y - 30 && y < w.y + w.h + 30) {
          ok = false; break;
        }
      }
    }
    toiletPapers.push({ x, y, picked: false });
  }

  // Plunger pickups
  plungers = [];
  for (let i = 0; i < 5; i++) {
    let x, y, ok = false, tries = 0;
    while (!ok && tries++ < 50) {
      x = 200 + Math.random() * (WORLD_W - 400);
      y = 200 + Math.random() * (WORLD_H - 400);
      ok = true;
      for (const w of walls) {
        if (x > w.x - 30 && x < w.x + w.w + 30 && y > w.y - 30 && y < w.y + w.h + 30) {
          ok = false; break;
        }
      }
    }
    plungers.push({ x, y, picked: false });
  }

  player = {
    x: 200, y: 200,
    r: 14,
    speed: 180,
    angle: 0,
    sprintLeft: 2.5,
    sprintMax: 2.5,
    sprintRegen: 0.4,
    walkPhase: 0,
  };

  toilets = [{
    x: WORLD_W - 300, y: WORLD_H - 300,
    r: 22,
    baseSpeed: 110,
    speed: 110,
    angle: 0,
    singTimer: 0,
    bobPhase: 0,
  }];
}

function moveCircle(ent, dx, dy) {
  ent.x += dx;
  for (const w of walls) {
    if (circleRectOverlap(ent.x, ent.y, ent.r, w)) {
      if (dx > 0) ent.x = w.x - ent.r;
      else if (dx < 0) ent.x = w.x + w.w + ent.r;
    }
  }
  ent.y += dy;
  for (const w of walls) {
    if (circleRectOverlap(ent.x, ent.y, ent.r, w)) {
      if (dy > 0) ent.y = w.y - ent.r;
      else if (dy < 0) ent.y = w.y + w.h + ent.r;
    }
  }
}

// --- Subtitles ---
let subtitleTimer = 0;
function say(text, ms = 2500) {
  subtitleEl.textContent = text;
  subtitleEl.classList.add("show");
  subtitleTimer = ms / 1000;
}

// --- State ---
let state = "menu";
let lastTime = 0;
let cam = { x: 0, y: 0 };
let screenShake = 0;
let survivalTime = 0;
let score = 0;
let particles = [];
let bestTime = parseFloat(localStorage.getItem("skibidi_best") || "0");

function resetGame() {
  buildWorld();
  state = "play";
  survivalTime = 0;
  score = 0;
  particles = [];
  screenShake = 0;
  poopOverlay.classList.remove("active");
  say("Skibidi dop dop dop yes yes!", 3000);
}

function spawnExtraToilet() {
  // Spawn far from player
  let x, y, tries = 0;
  do {
    x = 100 + Math.random() * (WORLD_W - 200);
    y = 100 + Math.random() * (WORLD_H - 200);
    tries++;
  } while (Math.hypot(x - player.x, y - player.y) < 600 && tries < 50);
  toilets.push({
    x, y,
    r: 22,
    baseSpeed: 100 + Math.random() * 30,
    speed: 100,
    angle: 0,
    singTimer: Math.random() * 3,
    bobPhase: Math.random() * Math.PI * 2,
  });
  say("Noch ein Skibidi taucht auf!!", 2200);
  skibidiSing();
}

function update(dt) {
  if (state !== "play") return;

  survivalTime += dt;

  // Spawn more toilets over time
  const desired = 1 + Math.floor(survivalTime / 20);
  if (toilets.length < desired && toilets.length < 6) {
    spawnExtraToilet();
  }

  // Player movement
  let mx = 0, my = 0;
  if (keys["w"] || keys["arrowup"]) my -= 1;
  if (keys["s"] || keys["arrowdown"]) my += 1;
  if (keys["a"] || keys["arrowleft"]) mx -= 1;
  if (keys["d"] || keys["arrowright"]) mx += 1;
  const len = Math.hypot(mx, my);
  if (len > 0) { mx /= len; my /= len; player.angle = Math.atan2(my, mx); }

  let speed = player.speed;
  const sprinting = keys["shift"] && player.sprintLeft > 0 && len > 0;
  if (sprinting) {
    speed *= 1.7;
    player.sprintLeft -= dt;
    if (player.sprintLeft < 0) player.sprintLeft = 0;
  } else {
    player.sprintLeft = Math.min(player.sprintMax, player.sprintLeft + dt * player.sprintRegen);
  }

  moveCircle(player, mx * speed * dt, my * speed * dt);
  if (len > 0) player.walkPhase += dt * (sprinting ? 16 : 10);

  // Pickups
  for (const tp of toiletPapers) {
    if (tp.picked) continue;
    const dx = player.x - tp.x, dy = player.y - tp.y;
    if (dx * dx + dy * dy < 30 * 30) {
      tp.picked = true;
      score += 10;
      pickupSound();
      spawnParticles(tp.x, tp.y, "#ffffff", 12);
    }
  }
  for (const pl of plungers) {
    if (pl.picked) continue;
    const dx = player.x - pl.x, dy = player.y - pl.y;
    if (dx * dx + dy * dy < 30 * 30) {
      pl.picked = true;
      player.sprintMax += 1.0;
      player.sprintLeft = player.sprintMax;
      score += 25;
      pickupSound();
      setTimeout(() => tone(1100, 0.12, "triangle", 0.2), 160);
      spawnParticles(pl.x, pl.y, "#ff5555", 16);
      say("Pömpel! Mehr Sprint!", 2000);
    }
  }

  // Toilets AI
  for (const t of toilets) {
    t.bobPhase += dt * 8;
    t.singTimer -= dt;
    if (t.singTimer <= 0) {
      skibidiSing();
      t.singTimer = 3 + Math.random() * 4;
    }

    // Difficulty ramp: toilets speed up over time
    t.speed = t.baseSpeed + survivalTime * 1.5;

    const dx = player.x - t.x, dy = player.y - t.y;
    const dist = Math.hypot(dx, dy);
    if (dist > 1) {
      let ang = Math.atan2(dy, dx);
      let testX = t.x + Math.cos(ang) * t.speed * dt;
      let testY = t.y + Math.sin(ang) * t.speed * dt;
      let blocked = false;
      for (const w of walls) {
        if (circleRectOverlap(testX, testY, t.r, w)) { blocked = true; break; }
      }
      if (blocked) {
        const tryAngles = [ang + 0.6, ang - 0.6, ang + 1.2, ang - 1.2, ang + Math.PI / 2, ang - Math.PI / 2];
        for (const a of tryAngles) {
          const tx = t.x + Math.cos(a) * t.speed * dt;
          const ty = t.y + Math.sin(a) * t.speed * dt;
          let ok = true;
          for (const w of walls) {
            if (circleRectOverlap(tx, ty, t.r, w)) { ok = false; break; }
          }
          if (ok) { ang = a; break; }
        }
      }
      moveCircle(t, Math.cos(ang) * t.speed * dt, Math.sin(ang) * t.speed * dt);
      t.angle = ang;
    }

    // Caught!
    const pdx = player.x - t.x, pdy = player.y - t.y;
    if (pdx * pdx + pdy * pdy < (player.r + t.r) * (player.r + t.r)) {
      state = "dead";
      poopSound();
      screenShake = 1.0;
      poopOverlay.classList.add("active");
      for (let i = 0; i < 80; i++) spawnParticles(player.x, player.y, "#5a3a1a", 1, 3);
      setTimeout(showDead, 900);
      return;
    }
  }

  // Particles
  for (const p of particles) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 200 * dt;
    p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);

  // Camera follow
  const targetCamX = player.x - W / 2;
  const targetCamY = player.y - H / 2;
  cam.x += (targetCamX - cam.x) * Math.min(1, dt * 8);
  cam.y += (targetCamY - cam.y) * Math.min(1, dt * 8);
  cam.x = Math.max(0, Math.min(WORLD_W - W, cam.x));
  cam.y = Math.max(0, Math.min(WORLD_H - H, cam.y));
  if (screenShake > 0) {
    screenShake -= dt;
    cam.x += (Math.random() - 0.5) * screenShake * 24;
    cam.y += (Math.random() - 0.5) * screenShake * 24;
  }

  if (subtitleTimer > 0) {
    subtitleTimer -= dt;
    if (subtitleTimer <= 0) subtitleEl.classList.remove("show");
  }
}

function spawnParticles(x, y, color, count, sizeMul = 1) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 200,
      vy: (Math.random() - 0.5) * 200 - 80,
      life: 0.5 + Math.random() * 0.6,
      maxLife: 1.0,
      color,
      size: (2 + Math.random() * 3) * sizeMul,
    });
  }
}

// --- Render ---
function render() {
  ctx.clearRect(0, 0, W, H);

  // Sky-ish grass background
  ctx.fillStyle = "#6db96d";
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(-cam.x, -cam.y);

  // Grass pattern
  const startX = Math.floor(cam.x / TILE) * TILE;
  const startY = Math.floor(cam.y / TILE) * TILE;
  for (let x = startX; x < cam.x + W + TILE; x += TILE) {
    for (let y = startY; y < cam.y + H + TILE; y += TILE) {
      const checker = ((x / TILE) + (y / TILE)) % 2 === 0;
      ctx.fillStyle = checker ? "#6db96d" : "#65b065";
      ctx.fillRect(x, y, TILE, TILE);
      // Grass tufts
      ctx.fillStyle = "#4a8a4a";
      const seed = (x * 31 + y * 17) % 7;
      if (seed < 3) {
        ctx.fillRect(x + 10 + seed * 4, y + 20, 2, 6);
        ctx.fillRect(x + 14 + seed * 4, y + 22, 2, 4);
      }
    }
  }

  // Bushes / hedges
  for (const b of bushes) {
    ctx.fillStyle = "#2d5a2d";
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = "#3d7a3d";
    ctx.fillRect(b.x + 4, b.y + 4, b.w - 8, b.h - 8);
    // Bumpy top
    ctx.fillStyle = "#4a9a4a";
    for (let bx = b.x + 6; bx < b.x + b.w; bx += 10) {
      ctx.beginPath();
      ctx.arc(bx, b.y + 4, 4, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Pickups: toilet paper
  for (const tp of toiletPapers) {
    if (tp.picked) continue;
    const bob = Math.sin(performance.now() / 300 + tp.x) * 3;
    ctx.save();
    ctx.translate(tp.x, tp.y + bob);
    // roll
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(0, 0, 11, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#aaa";
    ctx.lineWidth = 1;
    ctx.stroke();
    // hole
    ctx.fillStyle = "#8b7355";
    ctx.beginPath();
    ctx.arc(0, 0, 3, 0, Math.PI * 2);
    ctx.fill();
    // hanging sheet
    ctx.fillStyle = "#fff";
    ctx.fillRect(8, -2, 8, 14);
    ctx.strokeStyle = "#ddd";
    ctx.strokeRect(8, -2, 8, 14);
    ctx.restore();
  }

  // Pickups: plungers
  for (const pl of plungers) {
    if (pl.picked) continue;
    const bob = Math.sin(performance.now() / 250 + pl.x) * 3;
    ctx.save();
    ctx.translate(pl.x, pl.y + bob);
    // handle
    ctx.fillStyle = "#8b4513";
    ctx.fillRect(-2, -16, 4, 18);
    // cup
    ctx.fillStyle = "#cc3333";
    ctx.beginPath();
    ctx.ellipse(0, 4, 11, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#aa2222";
    ctx.beginPath();
    ctx.ellipse(0, 6, 9, 4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Particles (behind player/toilet)
  for (const p of particles) {
    ctx.fillStyle = p.color;
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Player
  drawPlayer();

  // Toilets
  for (const t of toilets) drawToilet(t);

  ctx.restore();

  drawHud();
}

function drawPlayer() {
  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.rotate(player.angle + Math.PI / 2);
  // Shadow
  ctx.fillStyle = "rgba(0,0,0,0.3)";
  ctx.beginPath();
  ctx.ellipse(0, 14, 12, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  // Legs (animated walk)
  const legSwing = Math.sin(player.walkPhase) * 5;
  ctx.fillStyle = "#3a3a8a";
  ctx.fillRect(-7, 6 + legSwing, 5, 10);
  ctx.fillRect(2, 6 - legSwing, 5, 10);

  // Body
  ctx.fillStyle = "#ffcc66";
  ctx.fillRect(-9, -8, 18, 16);
  // Shirt
  ctx.fillStyle = "#22aa44";
  ctx.fillRect(-9, -4, 18, 12);

  // Arms
  const armSwing = Math.sin(player.walkPhase) * 4;
  ctx.fillStyle = "#22aa44";
  ctx.fillRect(-12, -3 - armSwing, 4, 9);
  ctx.fillRect(8, -3 + armSwing, 4, 9);

  // Head
  ctx.fillStyle = "#ffd9a3";
  ctx.beginPath();
  ctx.arc(0, -12, 7, 0, Math.PI * 2);
  ctx.fill();
  // Hair
  ctx.fillStyle = "#3a2a1a";
  ctx.fillRect(-7, -19, 14, 4);

  // Eyes (looking forward in rotation direction)
  ctx.fillStyle = "#000";
  ctx.fillRect(-3, -13, 2, 2);
  ctx.fillRect(1, -13, 2, 2);

  // Scared mouth
  ctx.fillStyle = "#660000";
  ctx.beginPath();
  ctx.arc(0, -9, 2, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawToilet(t) {
  ctx.save();
  ctx.translate(t.x, t.y);

  // Shadow
  ctx.fillStyle = "rgba(0,0,0,0.4)";
  ctx.beginPath();
  ctx.ellipse(0, 18, 22, 7, 0, 0, Math.PI * 2);
  ctx.fill();

  // Toilet base (tank in back, bowl in front)
  ctx.rotate(t.angle + Math.PI / 2);

  // Tank
  ctx.fillStyle = "#e8e8e8";
  ctx.fillRect(-14, 4, 28, 14);
  ctx.strokeStyle = "#888";
  ctx.lineWidth = 2;
  ctx.strokeRect(-14, 4, 28, 14);
  // Flush button
  ctx.fillStyle = "#aaa";
  ctx.fillRect(-3, 6, 6, 3);

  // Bowl
  ctx.fillStyle = "#f0f0f0";
  ctx.beginPath();
  ctx.ellipse(0, -4, 18, 14, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#888";
  ctx.stroke();
  // Water
  ctx.fillStyle = "#5577aa";
  ctx.beginPath();
  ctx.ellipse(0, -4, 13, 9, 0, 0, Math.PI * 2);
  ctx.fill();

  // Seat rim
  ctx.strokeStyle = "#666";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(0, -4, 18, 14, 0, 0, Math.PI * 2);
  ctx.stroke();

  // The head popping out (bobbing)
  const bob = Math.sin(t.bobPhase) * 4;
  ctx.save();
  ctx.translate(0, -6 + bob);

  // Neck
  ctx.fillStyle = "#ffd9a3";
  ctx.fillRect(-4, 0, 8, 6);

  // Head
  ctx.fillStyle = "#ffd9a3";
  ctx.beginPath();
  ctx.arc(0, -6, 10, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#aa7755";
  ctx.lineWidth = 1;
  ctx.stroke();

  // Wild hair
  ctx.fillStyle = "#1a1a1a";
  for (let i = -8; i <= 8; i += 4) {
    ctx.beginPath();
    ctx.moveTo(i, -14);
    ctx.lineTo(i - 1, -19);
    ctx.lineTo(i + 2, -14);
    ctx.fill();
  }

  // Crazy eyes
  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.arc(-3, -7, 3, 0, Math.PI * 2);
  ctx.arc(3, -7, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#000";
  const eyeShift = Math.sin(performance.now() / 200) * 1;
  ctx.beginPath();
  ctx.arc(-3 + eyeShift, -7, 1.5, 0, Math.PI * 2);
  ctx.arc(3 + eyeShift, -7, 1.5, 0, Math.PI * 2);
  ctx.fill();

  // Singing mouth — opens and closes
  const mouthOpen = (Math.sin(t.bobPhase * 1.5) + 1) * 3 + 1;
  ctx.fillStyle = "#220000";
  ctx.beginPath();
  ctx.ellipse(0, -2, 4, mouthOpen, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#ff6666";
  ctx.beginPath();
  ctx.ellipse(0, -1, 2, mouthOpen * 0.5, 0, 0, Math.PI * 2);
  ctx.fill();

  // Teeth
  ctx.fillStyle = "#fff";
  ctx.fillRect(-3, -3, 6, 1.5);

  ctx.restore();
  ctx.restore();
}

function drawHud() {
  const time = survivalTime.toFixed(1);
  const sprintPct = Math.round((player.sprintLeft / player.sprintMax) * 100);
  const sprintBar = "█".repeat(Math.round(sprintPct / 10)) + "░".repeat(10 - Math.round(sprintPct / 10));
  hud.innerHTML = `
    <div>⏱️ ZEIT: ${time}s</div>
    <div>💩 PUNKTE: ${score}</div>
    <div>⚡ SPRINT: ${sprintBar}</div>
    <div>🚽 TOILETTEN: ${toilets.length}</div>
    ${bestTime > 0 ? `<div style="color:#ffe14a">🏆 REKORD: ${bestTime.toFixed(1)}s</div>` : ""}
  `;
}

// --- End screens ---
function showDead() {
  state = "dead";
  if (survivalTime > bestTime) {
    bestTime = survivalTime;
    localStorage.setItem("skibidi_best", bestTime.toString());
  }
  overlay.classList.remove("start");
  overlay.innerHTML = `
    <h1 style="color:#8b4513">ANGEKACKT! 💩</h1>
    <h2>Du wurdest erwischt.</h2>
    <p>
      Der Skibidi Toilet hat dich geschnappt<br>
      und gnadenlos angekackt.<br><br>
      <b>Überlebt:</b> ${survivalTime.toFixed(1)} Sekunden<br>
      <b>Punkte:</b> ${score}<br>
      ${survivalTime >= bestTime ? '<span style="color:#ffe14a">🏆 NEUER REKORD!</span><br>' : `Bestzeit: ${bestTime.toFixed(1)}s<br>`}
    </p>
    <button id="restartBtn">NOCHMAL FLIEHEN</button>
  `;
  overlay.classList.remove("hidden");
  document.getElementById("restartBtn").addEventListener("click", () => {
    overlay.classList.add("hidden");
    poopOverlay.classList.remove("active");
    resetGame();
  });
}

// --- Loop ---
function loop(ts) {
  const dt = Math.min(0.05, (ts - lastTime) / 1000 || 0);
  lastTime = ts;
  if (state === "play") update(dt);
  render();
  requestAnimationFrame(loop);
}

function fit() {
  const ratio = W / H;
  const ww = window.innerWidth;
  const wh = window.innerHeight;
  let cw = ww, ch = ww / ratio;
  if (ch > wh) { ch = wh; cw = wh * ratio; }
  canvas.style.width = cw + "px";
  canvas.style.height = ch + "px";
}
window.addEventListener("resize", fit);
fit();

startBtn.addEventListener("click", () => {
  ensureAudio();
  overlay.classList.add("hidden");
  resetGame();
});

buildWorld();
requestAnimationFrame(loop);
</script>
